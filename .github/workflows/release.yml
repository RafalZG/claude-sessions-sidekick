name: Release

# Triggered by pushing a version tag like `v1.0.0`. Builds Release, packs
# into a Velopack release bundle, and uploads everything to a new GitHub
# Release matching the tag name. Users running prior installed versions
# will pick this up via the in-app "Check for updates" flow.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required by `vpk upload github` to create the release

jobs:
  release:
    name: Pack & publish release
    runs-on: windows-latest
    # Expose the resolved version so the winget submission job can reuse it
    # without re-parsing the tag.
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: pwsh
        # Strip leading "v" so `v1.2.3` becomes `1.2.3` for vpk pack --packVersion.
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing version $version"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ClaudeSessionsSidekick.sln

      - name: Test (gate the release)
        run: dotnet test ClaudeSessionsSidekick.sln --configuration Release --verbosity minimal

      - name: Install Velopack CLI
        # Pin to the same version as the runtime NuGet package for reproducible
        # release bundles. Using `tool update` so re-runs of a failed release
        # job don't error with "tool already installed" from the cached PATH.
        run: dotnet tool update --global vpk --version 0.0.1298 || dotnet tool install --global vpk --version 0.0.1298

      - name: Publish (Release, win-x64, self-contained)
        # Self-contained bundles the .NET 10 Desktop Runtime inside the app, so
        # the installer works on a clean machine with no runtime installed and
        # the winget sandbox can never fail on a missing-dependency check. The
        # trade-off is a larger download (~60-70 MB vs ~11 MB) — acceptable for a
        # winget/GitHub-distributed dev tool, and it ends the recurring
        # Microsoft.DotNet.DesktopRuntime.10 resolution failures in winget
        # validation. We do NOT trim: WPF reflection/XAML doesn't trim safely.
        # `-p:Version` stamps the assembly version from the git tag so the About
        # window shows e.g. "1.0.3" instead of the csproj fallback.
        run: >
          dotnet publish ClaudeSessionsSidekick.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:Version=${{ steps.version.outputs.version }}

      - name: Pack with Velopack
        # `vpk pack` produces:
        #   Releases/        <- delta + full nupkg + RELEASES manifest
        #   Releases/*.exe   <- single-file installer
        # `vpk upload github` picks these up and attaches them to the release.
        run: >
          vpk pack
          --packId ClaudeSessionsSidekick
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe ClaudeSessionsSidekick.exe
          --packTitle "Claude Sessions Sidekick"
          --packAuthors "Rafał Zygmunt"
          --icon Resources/claude.ico

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          vpk upload github
          --repoUrl https://github.com/RafalZG/claude-sessions-sidekick
          --publish
          --releaseName "Claude Sessions Sidekick ${{ steps.version.outputs.version }}"
          --tag ${{ github.ref_name }}
          --token $env:GITHUB_TOKEN

      - name: Set release notes from CHANGELOG
        # vpk upload github creates the release with an EMPTY body. komac (in the
        # winget job) derives the manifest ReleaseNotes from that body, so an
        # empty body trips wingetbot Manifest-Metadata-Consistency. This step
        # copies the matching CHANGELOG section into the release body via the
        # REST API before the winget job runs. Non-fatal (continue-on-error): the
        # Setup.exe is already uploaded, so a notes failure only warns. The whole
        # script is wrapped in try/catch that emits a ::warning:: with the error,
        # so any failure is visible in the run annotations.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          try {
            $version = "${{ steps.version.outputs.version }}"
            $notesVersion = $version -replace '-.*$', ''
            $lines = Get-Content CHANGELOG.md
            $start = -1
            $end = $lines.Count
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^##\s*\[$([regex]::Escape($notesVersion))\]") { $start = $i + 1; continue }
              if ($start -ge 0 -and $lines[$i] -match "^##\s*\[") { $end = $i; break }
            }
            if ($start -lt 0) { Write-Host "::warning::No CHANGELOG section for $notesVersion"; return }
            $notes = ($lines[$start..($end - 1)] -join "`n").Trim()
            if ([string]::IsNullOrWhiteSpace($notes)) { Write-Host "::warning::CHANGELOG section for $notesVersion is empty"; return }
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28"; "User-Agent" = "release-workflow" }
            $repo = "${{ github.repository }}"
            $tag = "v$version"
            $rel = $null
            foreach ($attempt in 1..5) {
              try { $rel = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/$tag"; break }
              catch { Start-Sleep -Seconds 8 }
            }
            if ($null -eq $rel) { Write-Host "::warning::Release $tag not found after retries"; return }
            $payload = @{ body = $notes } | ConvertTo-Json -Depth 3
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($payload)
            Invoke-RestMethod -Method Patch -Headers $headers -ContentType "application/json; charset=utf-8" -Body $bytes -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)" | Out-Null
            Write-Host "Release notes set on $tag"
          } catch {
            Write-Host "::warning::notes step failed: $($_.Exception.Message)"
          }

# The winget submission moved to winget.yml (workflow_dispatch): the GitHub
# release ships automatically from the tag, the winget catalog PR is opened
# by hand after the release has been click-tested.
